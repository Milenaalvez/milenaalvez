name: generate snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: milenaalvez
          outputs: dist/github-snake.svg

      - name: push snake
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: output
          folder: dist
